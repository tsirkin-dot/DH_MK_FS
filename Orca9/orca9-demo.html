<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orca9 — маркетинговий оркестр (демо)</title>
<script src="orca9-pin.js?v=20261013f"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#182033; --ink-2:#55607A; --ink-3:#8A93A8;
  --rail:#1B2140; --rail-ink:#C9CEE0; --rail-hi:#FFFFFF;
  --mist:#EDF0F5; --paper:#FFFFFF; --line:#D9DEE8; --line-2:#C3CAD8;
  --brass:#B8891A; --brass-soft:#F4EAD1;
  --pass:#1E8A6E; --pass-soft:#DDF1EA;
  --hold:#B86E00; --hold-soft:#FBEBD2;
  --veto:#B9382A; --veto-soft:#F8DEDA;
  --act:#3442A8; --act-soft:#E2E5F7;
  --r:10px;
  --ui:'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --disp:'Unbounded', 'Onest', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);font-size:15px;line-height:1.5;color:var(--ink);background:var(--mist)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
/* rail */
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding:20px 12px;gap:4px;overflow:auto}
.logo{font-family:var(--disp);font-weight:600;font-size:22px;color:var(--rail-hi);padding:4px 10px 18px;letter-spacing:.5px}
.logo small{display:block;font-family:var(--ui);font-weight:400;font-size:12px;color:var(--rail-ink);letter-spacing:0;margin-top:2px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;color:inherit;text-align:left;padding:9px 10px;border-radius:8px;width:100%}
.nav:hover{background:rgba(255,255,255,.07)}
.nav[aria-current="page"]{background:rgba(255,255,255,.12);color:var(--rail-hi)}
.nav .ico{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--brass);color:#fff;font-size:12px;border-radius:9px;padding:0 7px;min-width:20px;text-align:center}
.rail .foot{margin-top:auto;font-size:12px;color:#8E95B3;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.08)}
/* main */
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-family:var(--disp);font-weight:500;font-size:20px;margin:0;margin-right:auto}
.ctrl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
select,input[type=text],input[type=number],input[type=date],textarea{border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;background:var(--paper)}
.btn{border:1px solid var(--line-2);background:var(--paper);border-radius:8px;padding:7px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--act);border-color:var(--act);color:#fff}
.btn.primary:hover{background:#28348A}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--veto)}
.btn[aria-disabled="true"]{opacity:.55}
.btn.live{background:var(--brass);border-color:var(--brass);color:#fff}
.body{display:grid;grid-template-columns:1fr 340px;min-height:0;flex:1}
#view{overflow:auto;padding:24px;min-width:0}
/* feed */
.feed{background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;background:none;padding:12px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--act)}
.feed-list{overflow:auto;padding:12px 16px;flex:1;display:flex;flex-direction:column;gap:10px}
.ev{font-size:13px;border-left:3px solid var(--line-2);padding:2px 0 2px 10px}
.ev time{color:var(--ink-3);font-size:12px;margin-right:6px}
.ev b{font-weight:600}
.ev.o{border-color:var(--brass)} .ev.ok{border-color:var(--pass)} .ev.warn{border-color:var(--hold)} .ev.bad{border-color:var(--veto)} .ev.h{border-color:var(--act)}
.slack{font-size:13px;display:grid;grid-template-columns:32px 1fr;gap:8px}
.slack .av{width:32px;height:32px;border-radius:7px;background:var(--rail);color:#fff;font-family:var(--disp);font-size:11px;display:grid;place-items:center}
.slack .who{font-weight:600} .slack .who time{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
.slack .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.slack-ch{padding:8px 16px;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line)}
.empty{color:var(--ink-3);font-size:13px;padding:20px 0;text-align:center}
/* blocks */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.panel h2{font-size:16px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.panel h2 .sp{margin-left:auto}
.metric{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.metric .lbl{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.metric .val{font-family:var(--disp);font-weight:500;font-size:24px;margin-top:4px}
.metric .sub{font-size:12px;color:var(--ink-3)}
.bar{height:6px;background:var(--mist);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--act)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--mist);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--pass-soft);color:var(--pass)} .chip.warn{background:var(--hold-soft);color:var(--hold)} .chip.bad{background:var(--veto-soft);color:var(--veto)} .chip.o{background:var(--brass-soft);color:#7A5A0C} .chip.act{background:var(--act-soft);color:var(--act)}
.muted{color:var(--ink-2)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.sec-gap{margin-top:16px}
/* score */
.score{display:grid;grid-template-columns:minmax(180px,1.4fr) repeat(8,minmax(56px,1fr));align-items:center}
.score .hd{font-size:12px;color:var(--ink-2);padding:0 0 8px;text-align:center}
.score .hd.gate{color:#7A5A0C;font-weight:600}
.score .lab{padding:10px 12px 10px 0;border-top:1px solid var(--line);min-width:0}
.score .lab button{border:0;background:none;padding:0;text-align:left;font-weight:600;width:100%}
.score .lab button:hover{color:var(--act)}
.score .lab .small{display:block;color:var(--ink-3);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{position:relative;height:56px;border-top:1px solid var(--line);display:grid;place-items:center}
.cell::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line)}
.cell.gate{border-left:3px solid var(--brass)}
.cell.done::before{background:var(--pass)}
.note{position:relative;width:16px;height:16px;border-radius:50%;background:var(--paper);border:2px solid var(--line-2)}
.note.done{background:var(--pass);border-color:var(--pass)}
.note.active{background:var(--act);border-color:var(--act);box-shadow:0 0 0 5px var(--act-soft)}
.note.return{background:var(--hold);border-color:var(--hold);box-shadow:0 0 0 5px var(--hold-soft)}
.note.veto{background:var(--veto);border-color:var(--veto)}
.note.skip{background:var(--mist);border-style:dashed;border-color:var(--ink-3)}
@media (prefers-reduced-motion:no-preference){ .note.active{animation:pulse 1.4s ease-in-out infinite} }
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(52,66,168,.12)}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .note{width:12px;height:12px}
/* approvals */
.ap{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--paper)}
.ap + .ap{margin-top:12px}
.ap .t{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.diff div{background:var(--mist);border-radius:8px;padding:8px 10px;font-size:13px}
.diff div b{display:block;font-size:12px;color:var(--ink-2);font-weight:500}
.diff .after{background:var(--act-soft)}
.verd{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;margin-bottom:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.field .l{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{border:1px solid var(--line-2);border-radius:8px;padding:6px 12px;display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.checks input:checked + span{font-weight:600}
.plan li{margin:6px 0}
.plan .ag{color:var(--ink-2);font-size:13px}
/* analytics */
.alist .item{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.alist .item[aria-current="true"]{border-color:var(--act);box-shadow:0 0 0 1px var(--act)}
.alist .big{font-family:var(--disp);font-weight:500;font-size:18px;color:var(--veto)}
.hyp{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.hyp:first-child{border-top:0}
.hyp .dot{width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--line-2)}
.hyp .dot.run{background:var(--act)}
.hyp .dot.yes{background:var(--veto)} .hyp .dot.no{background:var(--pass)} .hyp .dot.partial{background:var(--hold)} .hyp .dot.skip{background:var(--line)}
@media (prefers-reduced-motion:no-preference){ .hyp .dot.run{animation:blink .8s infinite alternate} }
@keyframes blink{to{opacity:.3}}
.opt{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;margin-top:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--act);background:var(--act-soft)}
.chart svg{width:100%;max-width:640px;height:auto;display:block}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--ink-2);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.me td{background:var(--act-soft)}
.tbl-wrap{overflow-x:auto}
.yes{color:var(--pass);font-weight:600} .no{color:var(--ink-3)}
.switch{position:relative;width:38px;height:22px;border-radius:11px;border:0;background:var(--line-2);padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--pass)}
.switch[aria-checked="true"]::after{left:19px}
/* pods */
.pod{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:14px 16px}
.pod h3{margin:0 0 8px;font-size:15px;display:flex;gap:8px;align-items:center}
.pod ul{list-style:none;margin:0;padding:0}
.pod li{padding:6px 0;border-top:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;gap:8px}
.pod li:first-child{border-top:0}
/* hints */
.hint{width:18px;height:18px;border-radius:50%;border:1px solid var(--brass);background:var(--brass-soft);color:#7A5A0C;font-size:11px;font-weight:600;display:inline-grid;place-items:center;padding:0;flex:none;line-height:1}
body.no-hints .hint{display:none}
#tip{position:fixed;z-index:60;max-width:280px;background:var(--rail);color:#fff;font-size:13px;line-height:1.45;padding:9px 12px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
/* tour */
#tour{position:fixed;inset:0;z-index:70;display:none}
#tour.on{display:block}
#tour .spot{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(14,18,38,.58);transition:all .25s;pointer-events:none}
#tour .pop{position:fixed;width:340px;max-width:calc(100vw - 24px);background:var(--paper);border-radius:12px;padding:18px 20px;box-shadow:0 18px 40px rgba(14,18,38,.3)}
#tour .pop h3{font-family:var(--disp);font-weight:500;font-size:17px;margin:0 0 8px}
#tour .pop p{margin:0 0 14px;font-size:14px;color:var(--ink-2)}
#tour .pop .nav-t{display:flex;align-items:center;gap:8px}
#tour .pop .nav-t .st{margin-right:auto;font-size:12px;color:var(--ink-3)}
/* modal */
#modal{position:fixed;inset:0;z-index:65;background:rgba(14,18,38,.5);display:none;place-items:center;padding:20px}
#modal.on{display:grid}
#modal .box{background:var(--paper);border-radius:12px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px}
#modal .box h2{font-family:var(--disp);font-weight:500;font-size:19px;margin:0 0 4px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.welcome{background:var(--rail);color:#fff;border-radius:var(--r);padding:18px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.welcome h2{font-family:var(--disp);font-weight:500;font-size:18px;margin:0 0 4px}
.welcome p{margin:0;color:var(--rail-ink);font-size:14px;max-width:60ch}
.welcome .acts{margin-left:auto}
.welcome .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.welcome .btn.primary{background:var(--brass);border-color:var(--brass)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0}
.stages{list-style:none;padding:0;margin:12px 0}
.stages li{display:grid;grid-template-columns:18px 130px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;align-items:start}
.stages li .note{width:14px;height:14px;margin-top:3px}

/* sections: SEO, PPC, PM, events, slack */
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.d6{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);display:inline-block}
.d6.c{background:var(--pass);border-color:var(--pass)} .d6.m{background:var(--pass-soft);border-color:var(--pass)}
.rec{scroll-margin-top:16px}
.rec.hi{box-shadow:0 0 0 2px var(--act)}
.rv{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.rvc{font-size:13px;margin:0 0 8px;padding-left:16px;color:var(--ink-2)}
.rvc li{margin:2px 0}
.reason{background:var(--hold-soft);color:#6E4300;border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
.reason.ok{background:var(--pass-soft);color:var(--pass)}
.gate td{font-size:13px}
.archlink{display:block;margin-top:10px;color:var(--rail-hi);font-weight:600;text-decoration:none;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 10px}
.archlink:hover{background:rgba(255,255,255,.07)}
.navlab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8E95B3;padding:14px 10px 4px}
.intro{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:var(--r);padding:14px 18px;margin-bottom:16px;font-size:14px;color:var(--ink-2)}
.intro b{color:var(--ink)}
.flow{list-style:none;margin:0;padding:0;counter-reset:f;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.flow li{counter-increment:f;background:var(--mist);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.flow li::before{content:counter(f);width:22px;height:22px;border-radius:50%;background:var(--brass-soft);color:#7A5A0C;border:1px solid var(--brass);font-size:12px;font-weight:600;display:grid;place-items:center}
.exm{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.exm:first-of-type{border-top:0}
.exm > div{flex:1;min-width:0}
.up{color:var(--pass);font-weight:600;font-size:12px} .down{color:var(--veto);font-weight:600;font-size:12px}
.sub-h{font-size:14px;margin:18px 0 8px}
.kan{display:grid;grid-template-columns:repeat(6,minmax(140px,1fr));gap:10px;overflow-x:auto}
.kan .col{background:var(--mist);border-radius:8px;padding:10px;min-height:120px}
.kan .col h4{margin:0 0 8px;font-size:12px;color:var(--ink-2);font-weight:600;display:flex;justify-content:space-between}
.kan .card{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:13px;margin-bottom:8px}
.lnk{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:13px}
.lnk:hover{color:var(--act)}
.evlist{display:flex;flex-direction:column;gap:10px;max-height:540px;overflow:auto}
pre.code{background:var(--rail);color:#E6E9F5;border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.5;overflow:auto;margin:0}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--mist);padding:1px 5px;border-radius:4px}
.panel h2 select{max-width:240px;font-size:13px;padding:5px 8px;font-weight:400}
.panel h2 .nw{white-space:nowrap}
.sl{display:grid;grid-template-columns:190px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper);height:620px;min-width:0}
.sl .chs{background:var(--rail);color:var(--rail-ink);padding:14px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.sl .ws{font-weight:600;color:#fff;padding:0 10px 12px;font-size:14px}
.sl .chb{border:0;background:none;color:inherit;text-align:left;padding:6px 10px;border-radius:6px;font-size:14px;display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.sl .chb:hover{background:rgba(255,255,255,.07)}
.sl .chb[aria-current="true"]{background:var(--act);color:#fff}
.sl .slm{display:flex;flex-direction:column;min-width:0;min-height:0}
.sl .slh{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
.sl .slh span{font-weight:400;margin-left:8px}
.sl-msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.sl .slc{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px}
.sl .slc input{flex:1;min-width:0}
.cmds{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px}
.cmds button{border:1px solid var(--line-2);background:var(--mist);border-radius:6px;font-size:12px;padding:3px 8px;font-family:ui-monospace,Menlo,Consolas,monospace}
.cmds button:hover{border-color:var(--ink-3)}
.slack .av.hu{background:var(--act)}
.chn{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
.linkish{border:0;background:none;padding:0;color:var(--act);text-decoration:underline;font-size:13px}
.dag svg{display:block;width:100%;height:auto;min-width:640px}
.dag{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#FBFCFE;padding:8px;margin:10px 0}
.mgrid{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.mgrid i,.legend .mg{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line-2);background:var(--paper)}
.legend .mg{width:12px;height:12px}
.mgrid i.t,.legend .mg.t{background:var(--act);border-color:var(--act)}
.mgrid i.c,.legend .mg.c{background:var(--mist);border-style:dashed;border-color:var(--ink-3)}

/* ---------- helpers ---------- */
const pending = () => S.approvals.filter(a => a.status === 'pending');
function canApprove(a) {
  const r = ROLES[S.role];
  if (r.chs && a.ch && !r.chs.some(c => String(a.ch).includes(c))) return false;
  if (a.risk === 'R3') return r.r3 > 0 && (S.r3Used?.[S.role] || 0) + (a.amount || 0) <= r.r3;
  return r.r2;
}
function denyReason(a) {
  const r = ROLES[S.role];
  if (r.chs && a.ch && !r.chs.some(c => String(a.ch).includes(c))) return `Роль ${r.name} не затверджує канал «${a.ch}». Її канали: ${r.chs.join(', ')}.`;
  if (a.risk === 'R3') { const used = S.r3Used?.[S.role] || 0; return r.r3 > 0 ? `Ліміт ролі ${r.name}: $${r.r3} на тиждень сукупно; уже зарезервовано $${used}, ця дія $${a.amount}. Потрібен Marketing lead або Owner.` : `Роль ${r.name} не затверджує зміни бюджету (R3).`; }
  return `Роль ${r.name} не затверджує публікації (R2).`;
}
function counts() {

  const n = S.anomalies.filter(a => a.status === 'new' || a.status === 'report').length; $('#cnt-an').textContent = n || ''; $('#cnt-an').style.display = n ? '' : 'none';

/* ---------- screens ---------- */
const TITLES = { hud: 'HUD', brief: 'Новий бриф', analytics: 'Аналітика', approvals: 'Апруви', seo: 'SEO', ppc: 'PPC', aiv: 'AI Visibility', recs: 'Рекомендації', cmps: 'Кампанії', groups: 'Групи сторінок', hotfix: 'Швидкі виправлення', pm: 'Менеджер проєкту', events: 'Демо подій', slackdemo: 'Демо Slack', agents: 'Агенти', crons: 'Розклад', roles: 'Ролі та доступи', audit: 'Журнал аудиту' };
function go(screen) { S.screen = screen; render(); $('#view').scrollTop = 0; }
/* Render only when the screen's HTML really changed, keep the scroll position, and never swap the DOM
   under a pressed mouse button: background work (pipelines, campaigns, groups) calls render() often,
   and replacing buttons mid-click used to swallow clicks and make screens flicker. */
let LAST_VIEW = { screen: null, html: '' }, PTR_DOWN = false, RENDER_PENDING = false;
if (typeof document !== 'undefined' && document.addEventListener) {
document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('#view')) PTR_DOWN = true; }, true);
document.addEventListener('pointerup', () => { PTR_DOWN = false; if (RENDER_PENDING) setTimeout(render, 0); }, true);
document.addEventListener('pointercancel', () => { PTR_DOWN = false; if (RENDER_PENDING) setTimeout(render, 0); }, true);
}
function render() {
  if (typeof cmpSync === 'function') cmpSync();
  $('#title').textContent = TITLES[S.screen] + (S.writesOff ? ' · записи вимкнено' : '');
  $$('.nav').forEach(b => b.setAttribute('aria-current', b.dataset.screen === S.screen ? 'page' : 'false'));
  let html;
  try { html = VIEWS[S.screen](); }
  catch (err) {
    console.error('Orca9 render', S.screen, err);
    html = `<div class="panel"><h2>Екран «${esc(TITLES[S.screen] || S.screen)}» не вдалося показати</h2><p class="small muted">${esc(err.message)}</p><p class="small">Найчастіше це старі файли в кеші браузера після оновлення сайту. Перезавантажте сторінку з очищенням кешу: Ctrl+F5 або Cmd+Shift+R.</p></div>`;
  }
  const sameScreen = LAST_VIEW.screen === S.screen;
  if (sameScreen && LAST_VIEW.html === html) { RENDER_PENDING = false; counts(); return; }
  if (sameScreen && PTR_DOWN) { RENDER_PENDING = true; counts(); return; }
  const v = $('#view'), top = v.scrollTop;
  const wasIn = document.activeElement && document.activeElement.id === 'sl-in';
  v.innerHTML = html; LAST_VIEW = { screen: S.screen, html }; RENDER_PENDING = false;
  if (sameScreen) v.scrollTop = top;
  counts();
  if (S.screen === 'analytics') drawCharts();
  if (S.screen === 'slackdemo') {
    const m = $('.sl-msgs'); if (m) m.scrollTop = m.scrollHeight;
    const i = $('#sl-in'); if (i && (wasIn || S.slFocus)) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
    S.slFocus = false;
  }
}

const ST_WHO = ['O1 Planner', 'Агенти подів', 'SEO-, PPC-, AIV-оркестратори', 'O2 Verifier', 'Координатор + O3', 'Людина за роллю', 'CRO, SEO, AIV + O2', 'Gateway'];
const ST_DO = ['розкладає мету на підзадачі', 'готують зміну з доказами', 'погоджують одну версію', 'перевіряє факти і джерела', 'збирає пакет, перевіряє політики', 'вирішує: тест, гроші, публікація', 'тест проти контролю', 'єдиний запис і read-back'];
const ST_STATE = { done: 'готово', active: 'в роботі', return: 'повернуто', wait: 'очікує', veto: 'вето або відкат', skip: 'не потрібно' };
function curStage(p) {
  const i = p.st.findIndex(x => x === 'active' || x === 'return' || x === 'veto'); if (i >= 0) return i;
  const w = p.st.findIndex(x => x === 'wait'); return w >= 0 ? w : 7;
}
function pipeState(p) { if (p.st.includes('veto')) return 'veto'; if (p.st.includes('return')) return 'return'; if (p.st[7] === 'done') return 'done'; if (p.st.includes('active')) return 'active'; return 'wait'; }

function scoreSwitch() {

}

      <div class="small muted">${p.id} · ${esc(p.ch)}${p.page || p.res ? ' · ' + esc(p.page || p.res) : ''}</div>
      <div class="segbar" aria-label="Етапи">${p.st.map((x, k) => `<i class="${x} ${GATES.includes(k) ? 'g' : ''} ${k === i && stt !== 'done' ? 'cur' : ''}" title="${ST[k]}: ${ST_STATE[x]}"></i>`).join('')}</div>
      <div class="seglab">${ST.map((n, k) => `<span class="${k === i ? 'on' : ''}">${k === i ? esc(n) : ''}</span>`).join('')}</div>
      <div class="small"><b>${stt === 'done' ? 'Виконано' : 'Зараз: ' + ST[i]}</b>${stt === 'done' ? '' : ` · ${ST_WHO[i]} ${ST_DO[i]}`}</div>

}
function scoreFlow(list) {
  const cols = ST.map(() => []);
  list.forEach(p => cols[curStage(p)].push(p));
  return `<div class="pflow">${ST.map((n, k) => `<div class="col ${GATES.includes(k) ? 'g' : ''}"><h4><span>${k} · ${n}</span><span>${cols[k].length}</span></h4><div class="small muted" style="margin:-4px 0 8px">${ST_WHO[k]}</div>

}
function scoreHTML(list = S.pipelines) {

function scoreClassic(list = S.pipelines) {

/* ---------- chart ---------- */
function drawCharts() {
  $$('.chart').forEach(el => {
    const t = S.tests.find(x => x.id === el.dataset.test); if (!t) return;
    const W = 460, H = 210, L = 34, R = 14, T = 18, B = 28;
    const a = S.anomalies.find(x => x.id === t.an);
    const ts = a.test.slice(0, t.week + 1), cs = a.ctrl.slice(0, t.week + 1);
    const lo = 90, hi = 130;
    const X = i => L + i * (W - L - R) / 3, Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
    const pts = arr => arr.map((v, i) => `${X(i)},${Y(v)}`).join(' ');
    let g = '';
    for (let v = 90; v <= 130; v += 10) g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E3E7EF"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="12" fill="#8A93A8">${v}</text>`;
    for (let i = 0; i < 4; i++) g += `<text x="${X(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === 3 ? 'end' : 'middle'}" font-size="12" fill="#8A93A8">тиждень ${i}</text>`;
    const last = ts.length - 1;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Тест проти контролю">${g}
      <polyline points="${pts(cs)}" fill="none" stroke="#8A93A8" stroke-width="2" stroke-dasharray="5 4"/>
      <polyline points="${pts(ts)}" fill="none" stroke="#3442A8" stroke-width="2.5"/>
      ${ts.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="#3442A8"/>`).join('')}
      <text x="${X(last) + (last === 3 ? -6 : 8)}" y="${Y(ts[last]) - 8}" font-size="13" font-weight="600" fill="#3442A8" text-anchor="${last === 3 ? 'end' : 'start'}">${ts[last] - cs[last] >= 0 ? '+' : ''}${ts[last] - cs[last]}% до контролю</text></svg>`;
  });
}

/* ---------- actions ---------- */
function approve(id, via) {
  const a = S.approvals.find(x => x.id === id);
  if (!a || a.status !== 'pending') return;
  if (!canApprove(a)) { toast(denyReason(a)); return; }
  const target = S.pipelines.find(x => x.id === a.pl);
  if (target?.land && (!packetReady(target) || a.packetFingerprint !== packetFingerprint(target))) { toast('Погодження пакета застаріло або сторінка зайнята. Потрібне повторне узгодження.'); return; }
  const add = a.risk === 'R3' ? Math.round((a.amount || 0) / 2) : 0;
  if (add && S.budgetUsed + add > S.budget) { ev('bad', 'O3 Auditor', `вето: ${a.id} вивело б витрати тижня за ліміт $${S.budget.toLocaleString('uk')}`); toast('O3: дія перевищила б тижневий бюджет. Не затверджено.'); return; }
  a.status = 'approved'; a.by = ROLES[S.role].name;
  if (a.risk === 'R3') { S.budgetUsed += add; S.r3Used[S.role] = (S.r3Used[S.role] || 0) + (a.amount || 0); }
  const p = S.pipelines.find(x => x.id === a.pl);
  if (p && a.phase === 'rollout') p.rolloutApproved = true;
  if (p) { p.st[5] = 'done'; if (p.packet) p.packet.humanApproved = true; p.note = `Затверджено (${a.by}).${p.land ? ' Дозволено обмежений тест пакета.' : ' Дію виконано.'}`; p.out[5] = `Затвердив ${a.by}`; }
  if (a.onApprove) a.onApprove();
  ev('h', ROLES[S.role].name, `затвердив: ${a.title}${via ? ' (зі Slack)' : ''}`);
  const land = p && p.land;
  ev('ok', 'O3 Auditor', land ? a.phase === 'rollout' ? `дозволив розгортання пакета: ${a.title}` : `запускає обмежений тест пакета: ${a.title}` : `пропустив дію назовні: ${a.title}`);
  slack(`Затверджено: <b>${esc(a.title)}</b>. ${land ? a.phase === 'rollout' ? 'Застосовую погоджений пакет через gateway.' : 'Запускаю обмежений тест; основна сторінка незмінна.' : 'Виконую.'}`, [], chOf(a.ch));
  toast(land ? a.phase === 'rollout' ? 'Дозволено розгортання погодженого пакета.' : 'Дозволено обмежений тест пакета.' : 'Затверджено. Дію виконано.');
  render();
  if (p) finish(p);
}
function decide(id, status) {
  const a = S.approvals.find(x => x.id === id);
  if (!a || !canApprove(a)) { toast(a ? denyReason(a) : ''); return; }
  a.status = status; a.by = ROLES[S.role].name;
  if (a.onReject) a.onReject(status);
  const p = S.pipelines.find(x => x.id === a.pl);
  if (p) {
    if (p.land && p.page) delete pageState(p.page).testContent;
    if (!p.land && p.res && status !== 'returned') releasePage(p.res, p.id, status);
    if (status === 'returned') { p.st = ['done', 'active', 'wait', 'wait', 'wait', 'wait', 'wait', 'wait']; p.note = 'Повернуто людиною на доопрацювання.'; }
    else { p.st[5] = 'veto'; p.note = 'Відхилено людиною.'; }
    if (p.land && status !== 'returned') releasePage(p.page, p.id, 'rejected');
    if (p.packet && status === 'returned') newPacket(p);
  }
  ev('h', ROLES[S.role].name, `${status === 'returned' ? 'повернув на доопрацювання' : 'відхилив'}: ${a.title}`);
  toast(status === 'returned' ? 'Повернуто агенту з коментарем.' : 'Відхилено.');
  render();
  if (status === 'returned' && p) runPipeline(p, 1, false);
}

async function runPipeline(p, from = 0, withReturn = false) {
  if (p.running || p.st[7] === 'done' || p.st.includes('veto')) return;
  if (p.land && !p.page) {
    p.st[1] = 'return'; p.note = 'Немає явного ресурсу (page або group): Координатор не приймає пакет без адреси.';

function sendSlash() {

function slashCmd(raw) {
  const ch = S.slCh, r = ROLES[S.role];
  slack(esc(raw), [], ch, r.name);
  const reply = (t, a = []) => setTimeout(() => slack(t, a, ch), 450);
  const parts = raw.split(/\s+/), cmd = parts[0], sub = (parts[1] || '').toLowerCase(), arg = parts.slice(2).join(' ');
  if (cmd !== '/orchestra') return reply('Я реагую на команди <code>/orchestra</code>. Наберіть <code>/orchestra help</code>.');
  if (sub === 'status') {
    const inWork = S.pipelines.filter(p => p.st[7] !== 'done' && !p.st.includes('veto')).length;
    const open = S.anomalies.filter(a => a.status === 'new' || a.status === 'report').length;
    return reply(`У роботі <b>${inWork}</b> задач. На апруві <b>${pending().length}</b>: ${pending().map(a => a.id).join(', ') || '—'}.<br>PPC: $${S.budgetUsed.toLocaleString('uk')} з $${S.budget.toLocaleString('uk')} за тиждень. Аномалій без рішення: ${open}.<br>Кампанії в роботі: ${S.cmps.filter(c => c.status === 'running').length}; групові пакети в тесті: ${S.gps.filter(g => ['test', 'rollout'].includes(g.status)).length}; швидкі виправлення: ${S.hotfixes.filter(h => !['new', 'done'].includes(h.status)).length}; записи ${S.writesOff ? 'вимкнено' : 'дозволені'}.`, pending().length ? [{ label: 'Відкрити апруви', action: 'nav-to', screen: 'approvals' }] : []);
  }
  if (sub === 'brief') {
    if (!arg) return reply('Додайте мету: <code>/orchestra brief Вебінар для CFO</code>');
    return setTimeout(() => {
      const c = cmpFromBrief({ title: arg, chs: ['Контент', 'SMM', 'Email'], budget: 0, icp: 'з brand-context.md' });
      slack(`Прийняв бриф <b>${esc(arg)}</b>. Оркестратор кампаній розклав його на ${c.packets.length} пакетів: ${c.id}.`, [{ label: 'Відкрити кампанію', action: 'nav-to', screen: 'cmps' }], ch);
    }, 450);
  }
  if (sub === 'approve') {
    const a = S.approvals.find(x => x.id === arg.toUpperCase());
    if (!a) return reply(`Не знайшов апрув <b>${esc(arg) || '—'}</b>. Відкриті: ${pending().map(x => x.id).join(', ') || 'немає'}.`);
    if (a.status !== 'pending') return reply(`${a.id} уже вирішено.`);
    if (!canApprove(a)) return reply(esc(denyReason(a)));
    return setTimeout(() => { approve(a.id, true); if (chOf(a.ch) !== ch) slack(`Готово. Деталі в #${chOf(a.ch)}.`, [], ch); }, 450);
  }
  if (sub === 'why') {
    const a = arg && S.anomalies.find(x => x.page === arg || x.page.includes(arg));
    if (!a) return reply(`Вкажіть сторінку: ${S.anomalies.map(x => `<code>${x.page}</code>`).join(', ')}`);
    if (a.status === 'new') { reply(`${a.page} ще не діагностовано. Запускаю діагностику, результат прийде в #seo.`); return setTimeout(() => diagnose(a), 500); }
    if (a.status === 'diag') return reply(`${a.page}: діагностика триває.`);
    return reply(`<b>${a.page}</b>: ${esc(a.cause)} (впевненість ${a.conf}%).${a.chosen ? '<br>Рішення: ' + esc(a.chosen) : ''}`, [{ label: 'Відкрити звіт', action: 'open-an', id: a.id }]);
  }
  if (sub === 'pause' || sub === 'resume') {
    if (!r.crons) return reply(`Роль ${r.name} не змінює розклад.`);
    const q = arg.toLowerCase(), c = q && S.crons.find(x => x.id === q || x.name.toLowerCase().includes(q));
    if (!c) return reply(`Вкажіть цикл: ${S.crons.map(x => `<code>${x.id}</code>`).join(', ')}`);
    c.on = sub === 'resume';
    ev('h', r.name, `${c.on ? 'увімкнув' : 'поставив на паузу'} «${c.name}» зі Slack`);
    return reply(`${c.on ? 'Увімкнено' : 'На паузі'}: <b>${c.name}</b> (${c.human}).`);
  }
  if (sub === 'report') return setTimeout(() => { slack('Тижневий звіт про зміни готовий. Повна версія в Google Docs.', [], ch); ev('ok', 'Marketing Data Storyteller', 'тижневий звіт надіслано в Slack'); }, 450);
  reply(`Команди:<br><code>/orchestra brief &lt;мета&gt;</code> — новий бриф<br><code>/orchestra status</code> — стан конвеєрів<br><code>/orchestra approve AP-…</code> — затвердити<br><code>/orchestra why &lt;сторінка&gt;</code> — причина аномалії<br><code>/orchestra pause|resume &lt;цикл&gt;</code> — розклад<br><code>/orchestra report</code> — тижневий звіт`);
}

  { screen: 'agents', pre: () => { S.inTab.agents = 'list'; }, sel: '[data-tour=agents-list] .pod li', h: 'Паспорт агента', p: 'Натисніть на будь-якого агента — відкриється паспорт: коли запускається, куди ходить і з якими правами, що збирає, як працює по кроках, що видає (приклад JSON), кому передає, ворота, чого не робить і як міряємо його якість. Внизу — приклад запуску з кнопкою «Програти».' },
  { screen: 'agents', pre: () => { S.inTab.agents = 'graph'; }, sel: '[data-tour=agents-view]', h: 'Хто кому передає', p: 'Граф побудовано з паспортів: товщина лінії — скільки агентів пода передають результат цьому адресату. Видно, що потоки сходяться на канальних оркестраторах і Координаторі. Вкладка «Куди ходять» показує, які системи под читає, де пише чернетки, а де пише лише через Gateway.' },
  { screen: 'facts', sel: '[data-tour=fr-layers]', h: 'Реєстр фактів', p: 'Ціни, дати й цифри мають одне джерело. Факт правильний, коли збігаються джерело, реєстр, сайт і відповіді AI. Розбіжність не застосовується сама — вирішує власник факту. Кожен факт має строк дії: прострочений O2 не пропускає в нові тексти. Спробуйте «Звірити з джерелами зараз».' },
  { screen: 'world', sel: '[data-tour=world-tl]', h: 'Світ і події', p: 'Апдейти Google, нові моделі в AI-системах, свята в країнах із великою часткою трафіку. Тест-гейт не зараховує зачеплений тиждень і подовжує вікно. Червона точка на вікні тесту — подія з правилом для цього тесту. Кнопка «Симулювати апдейт Google» під час тесту покаже, як тиждень не зараховується.' },
  { screen: 'agentqa', sel: '[data-tour=aq-rel]', h: 'Агент не оцінює сам себе', p: 'Кожну зміну промпту чи моделі перевіряє Регресійний контролер на еталонних кейсах. Аудитор відповідей щодня ловить дрейф. Запустіть RL-7: дешевша модель не пройде.' },
  { screen: 'agentqa', sel: '[data-tour=aq-drift]', h: 'Дрейф: якість падає без наших змін', p: 'Аудитор відповідей щодня оцінює 5% реальних результатів кожного агента іншою моделлю. Після нової моделі ChatGPT Citation Analyst просів до 86 при порозі 90 — тепер людина перевіряє 100% його висновків. «Розібрати дрейф» покаже причину і фікс. Нижче — остання перевірка кожного агента за 7 метриками.' },
  { screen: 'recs', sel: '#rec-REC-3', h: 'Спробуйте повний сценарій', p: 'REC-3: узгодити → конфлікт → компроміс → дозволити тест → три тижні → розгорнути. Далі «Кампанії», «Групи сторінок» і «Швидкі виправлення». Архітектура зі схемами — посилання внизу меню.' }
];
let TI = -1;
function tour(i) {
  TI = i; const s = TOUR[i];
  if (s.pre) s.pre();
  if (S.screen !== s.screen || s.pre) go(s.screen);
  const L = $('#tour'); L.classList.add('on');
  $('#tour-h').textContent = s.h; $('#tour-p').textContent = s.p;
  $('#tour-st').textContent = `${i + 1} з ${TOUR.length}`;
  $('#tour-next').textContent = i === TOUR.length - 1 ? 'Завершити' : 'Далі';
  $('[data-action=tour-prev]').style.visibility = i ? 'visible' : 'hidden';
  requestAnimationFrame(() => {
    const spot = $('#tour .spot'), pop = $('#tour .pop');
    const el = s.sel && $(s.sel);
    if (el) {
      const tall = el.getBoundingClientRect().height > innerHeight * 0.55;
      el.scrollIntoView({ block: tall ? 'start' : 'nearest', behavior: 'smooth' });
      setTimeout(() => {
        const r = el.getBoundingClientRect(), pad = 6;
        const top0 = Math.max(r.top, 8), bottom0 = Math.min(r.bottom, innerHeight - 8);
        Object.assign(spot.style, { left: r.left - pad + 'px', top: top0 - pad + 'px', width: r.width + pad * 2 + 'px', height: Math.max(0, bottom0 - top0) + pad * 2 + 'px', display: 'block' });
        const pw = pop.offsetWidth, ph = pop.offsetHeight;
        let top, left = Math.min(Math.max(12, r.left), innerWidth - pw - 12);
        if (bottom0 + 14 + ph <= innerHeight - 12) top = bottom0 + 14;
        else if (top0 - ph - 14 >= 12) top = top0 - ph - 14;
        else { top = innerHeight - ph - 20; left = Math.max(12, innerWidth - pw - 24); }
        top = Math.min(Math.max(12, top), innerHeight - ph - 12);
        Object.assign(pop.style, { top: top + 'px', left: left + 'px' });
      }, 420);
    } else {
      Object.assign(spot.style, { left: innerWidth / 2 + 'px', top: innerHeight / 2 + 'px', width: '0px', height: '0px' });
      Object.assign(pop.style, { top: (innerHeight - pop.offsetHeight) / 2 + 'px', left: (innerWidth - pop.offsetWidth) / 2 + 'px' });
    }
    $('#tour-next').focus();
  });
}
function endTour() { $('#tour').classList.remove('on'); TI = -1; }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const nav = e.target.closest('.nav'); if (nav) { if (TI >= 0) endTour(); go(nav.dataset.screen); return; }
  const b = e.target.closest('[data-action]'); if (!b) return;
  const id = b.dataset.id, A = b.dataset.action;
  const map = {
    'toggle-hints': () => { const off = document.body.classList.toggle('no-hints'); b.textContent = off ? 'Показати підказки' : 'Сховати підказки'; },
    tour: () => tour(0), 'tour-next': () => TI < TOUR.length - 1 ? tour(TI + 1) : endTour(), 'tour-prev': () => tour(Math.max(0, TI - 1)), 'tour-end': endTour,
    sim: simulate,
    'feed-tab': () => { S.feedTab = b.dataset.tab; $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === S.feedTab)); renderFeed(); },
    'open-pl': () => openPipeline(S.pipelines.find(p => p.id === id)),
    'fix-pl': () => { closeModal(); const p = S.pipelines.find(x => x.id === id); p.out[3] = 'Після виправлень — ок'; runPipeline(p, 1, false); },
    'close-modal': closeModal,
    'nav-to': () => { closeModal(); go(b.dataset.screen || 'approvals'); },
    approve: () => approve(id), 'approve-slack': () => approve(id, true),
    'return-ap': () => decide(id, 'returned'), reject: () => decide(id, 'rejected'),
    'brief-plan': () => { const d = briefData(); if (validBrief(d)) showPlan(d); },
    'brief-launch': () => {
      const d = briefData(); if (!validBrief(d)) return;
      const c = cmpFromBrief(d);
      slack(`Новий бриф: <b>${esc(d.title)}</b>. Оркестратор кампаній розклав його на ${c.packets.length} пакетів.`, [{ label: 'Відкрити кампанію', action: 'nav-to', screen: 'cmps', primary: true }]);
      toast('Бриф розкладено на пакети. Граф — на екрані «Кампанії».');
      go('cmps');
    },
    'sel-an': () => { S.selAn = id; render(); },
    'open-an': () => { S.selAn = id; S.anTab = 'anom'; go('analytics'); },
    'an-tab': () => { S.anTab = id; render(); },
    'vz-anom': () => { S.anTab = 'anom'; render(); },
    'vz-weeks': () => { vzState().weeks = +id; render(); },
    'vz-grp': () => { vzState().grp = id; render(); },
    'vz-table': () => { vzState().table = !vzState().table; render(); },
    diag: () => diagnose(S.anomalies.find(a => a.id === id)),
    'approve-report': () => approveReport(S.anomalies.find(a => a.id === id)),
    'reject-report': () => { const a = S.anomalies.find(x => x.id === id); a.status = 'closed'; a.chosen = 'Відхилено людиною'; ev('h', ROLES[S.role].name, `відхилив план для ${a.page}`); render(); },
    week: () => weekForward(S.tests.find(t => t.id === id)),
    deploy: () => deploy(S.tests.find(t => t.id === id)),
    weekly, 'weekly-send': () => { closeModal(); slack('Тижневий звіт про зміни готовий. Повна версія в Google Docs.'); ev('ok', 'Marketing Data Storyteller', 'тижневий звіт надіслано в Slack'); toast('Звіт надіслано в Slack.'); },
    'cron-toggle': () => { if (!ROLES[S.role].crons) { toast(`Роль ${ROLES[S.role].name} не змінює розклад.`); return; } const c = S.crons.find(x => x.id === id); c.on = !c.on; ev('h', ROLES[S.role].name, `${c.on ? 'увімкнув' : 'поставив на паузу'} «${c.name}»`); render(); },
    ex: () => (EX[id] || SCALE_ACTIONS[id])?.(id),
    'score-view': () => { S.scoreView = id; try { localStorage.setItem('orca9-score-view', id); } catch (e) {} render(); },
    'open-rec': () => { closeModal(); openRec(id); },
    'rec-review': () => reviewRec(S.recs.find(r => r.id === id)),
    'rec-approve': () => recApprove(S.recs.find(r => r.id === id)),
    'rec-reject': () => rejectPacket(S.recs.find(x => x.id === id)),
    'packet-comp': () => changePacketVariant(S.recs.find(x => x.id === id), 'comp'),
    'packet-orig': () => changePacketVariant(S.recs.find(x => x.id === id), 'orig'),
    'packet-end': () => pcEndTest(S.recs.find(x => x.id === id)),
    'page-queue': demoPageQueue,
    'rec-week': () => recWeek(S.recs.find(r => r.id === id)),
    'rec-deploy': () => recDeploy(S.recs.find(r => r.id === id)),
    'seo-jira': () => seoJira(id),
    nudge: () => nudge(id),
    'sl-ch': () => { S.slCh = id; render(); },
    'sl-send': sendSlash,
    'sl-fill': () => { S.slDraft = id; S.slFocus = true; render(); },
    'cron-run': () => runCron(S.crons.find(x => x.id === id))
  };
  if (b.getAttribute('aria-disabled') === 'true' && ['approve', 'return-ap', 'reject', 'approve-report', 'cron-toggle', 'rec-approve', 'rec-reject'].includes(A)) { map[A](); return; }
  if (map[A]) map[A](); else if (SCALE_ACTIONS[A]) SCALE_ACTIONS[A](id, b);
});
document.addEventListener('change', e => {
  if (e.target.id === 'role') { S.role = e.target.value; ev('h', 'Демо', `роль змінено на ${ROLES[S.role].name}`); render(); }
  if (e.target.id === 'audit-f') { S.auditF = e.target.value; render(); }
  if (e.target.id === 'ev-f') { S.evF = e.target.value; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'sl-in') S.slDraft = e.target.value;
  if (e.target.id === 'ag-q') { S.agentQ = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#ag-q'); i.focus(); i.setSelectionRange(pos, pos); }
  if (e.target.closest('#view') && e.target.closest('[data-tour=brief-form]')) $('#b-err') && ($('#b-err').textContent = '');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'sl-in') { e.preventDefault(); sendSlash(); return; }
  if (e.key === 'Escape') { if (TI >= 0) endTour(); closeModal(); }
  if (TI >= 0 && e.key === 'ArrowRight') TI < TOUR.length - 1 ? tour(TI + 1) : endTour();
  if (TI >= 0 && e.key === 'ArrowLeft' && TI > 0) tour(TI - 1);
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
/* tooltips */
const tip = $('#tip');
function showTip(el) {
  tip.textContent = el.dataset.hint; tip.classList.add('on');
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
  let top = r.bottom + 8; if (top + h > innerHeight - 8) top = r.top - h - 8;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
const hideTip = () => tip.classList.remove('on');
document.addEventListener('mouseover', e => { const h = e.target.closest('[data-hint]'); h ? showTip(h) : hideTip(); });
document.addEventListener('focusin', e => { const h = e.target.closest('[data-hint]'); h ? showTip(h) : hideTip(); });
document.addEventListener('scroll', hideTip, true);
addEventListener('resize', () => { if (TI >= 0) tour(TI); });

scaleInit();
worldInit();
insightInit();
seedPipelinePackets();
render(); renderFeed();
setTimeout(() => tour(0), 700);
</script>
